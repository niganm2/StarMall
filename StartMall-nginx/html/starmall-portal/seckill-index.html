<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=9; IE=8; IE=7; IE=EDGE">
  <title>星购商城 StarMall - 限时秒杀</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20261016"/>
  <link rel="stylesheet" type="text/css" href="css/webbase.css"/>
  <link rel="stylesheet" type="text/css" href="css/top-bar.css?v=20261204"/>
  <style>
    body { background: #F5F5F5; }
    .seckill-page { width: 990px; max-width: calc(100% - 40px); margin: 18px auto 40px; }
    .seckill-banner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 30px; color: #FFF; border-radius: 8px; margin-bottom: 18px;
      background: linear-gradient(120deg, #E1251B 0%, #FF5A36 55%, #FF8A3D 100%);
      box-shadow: 0 6px 18px rgba(225, 37, 27, .25);
    }
    .seckill-banner h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 4px; }
    .seckill-banner p { margin: 0; font-size: 13px; opacity: .92; }
    .seckill-countdown { text-align: right; }
    .seckill-countdown span { display: block; font-size: 12px; margin-bottom: 6px; opacity: .92; }
    .seckill-countdown b {
      display: inline-block; min-width: 34px; padding: 4px 6px; margin: 0 2px;
      font-size: 20px; line-height: 24px; text-align: center; color: #E1251B;
      background: #FFF; border-radius: 4px;
    }
    .seckill-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 760px) { .seckill-list { grid-template-columns: 1fr; } }
    .seckill-card { display: flex; padding: 16px; background: #FFF; border-radius: 8px; }
    .seckill-card img {
      width: 130px; height: 130px; flex: none; object-fit: contain;
      border: 1px solid #F0F0F0; border-radius: 6px;
    }
    .seckill-info { flex: 1; min-width: 0; margin-left: 14px; display: flex; flex-direction: column; }
    .seckill-name {
      margin: 0 0 8px; font-size: 14px; line-height: 20px; color: #333;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .seckill-price-line { display: flex; align-items: baseline; margin-bottom: 8px; }
    .seckill-price { font-size: 24px; font-weight: 700; color: #E1251B; }
    .seckill-price small { font-size: 14px; margin-right: 2px; }
    .origin-price { margin-left: 10px; font-size: 12px; color: #999; text-decoration: line-through; }
    .stock-text { font-size: 12px; color: #666; margin-bottom: 6px; }
    .stock-bar { height: 8px; background: #F0F0F0; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
    .stock-bar i { display: block; height: 100%; background: linear-gradient(90deg, #FF8A3D, #E1251B); }
    .seckill-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .seckill-tip { font-size: 12px; color: #999; }
    .seckill-btn {
      padding: 8px 22px; font-size: 14px; color: #FFF; background: #E1251B;
      border: none; border-radius: 20px; cursor: pointer; outline: none;
      transition: background-color .2s;
    }
    .seckill-btn:hover:not(:disabled) { background: #C81D14; }
    .seckill-btn:disabled { background: #CCC; cursor: not-allowed; }
    .seckill-btn.view { background: #2B59C3; }
    .seckill-btn.view:hover { background: #2248A3; }
    .seckill-empty { padding: 60px 0; text-align: center; font-size: 14px; color: #999; background: #FFF; border-radius: 8px; }
    .seckill-mask {
      position: fixed; inset: 0; z-index: 999; display: flex;
      align-items: center; justify-content: center; background: rgba(0, 0, 0, .45);
    }
    .seckill-dialog {
      width: 360px; max-width: calc(100% - 40px); padding: 26px 24px;
      background: #FFF; border-radius: 10px; text-align: center;
    }
    .seckill-dialog h3 { margin: 0 0 10px; font-size: 20px; color: #E1251B; }
    .seckill-dialog p { margin: 0 0 6px; font-size: 13px; color: #666; line-height: 20px; }
    .seckill-dialog .order-no { font-size: 13px; color: #333; word-break: break-all; }
    .seckill-dialog .dialog-btns { margin-top: 18px; display: flex; justify-content: center; gap: 12px; }
    .dialog-btn {
      padding: 7px 20px; font-size: 13px; color: #FFF; background: #2B59C3;
      border: none; border-radius: 4px; cursor: pointer; outline: none;
    }
    .dialog-btn.plain { color: #666; background: #FFF; border: 1px solid #DDD; }
  </style>
</head>

<body>
<div id="seckillApp">
  <top></top>

  <div class="seckill-page">
    <div class="seckill-banner">
      <div>
        <h1>限时秒杀</h1>
        <p>Redis 预减库存 · MQ 异步下单 · 每人限购一件</p>
      </div>
      <div class="seckill-countdown">
        <span>本场结束倒计时</span>
        <div>
          <b>{{countdown.h}}</b>:<b>{{countdown.m}}</b>:<b>{{countdown.s}}</b>
        </div>
      </div>
    </div>

    <div v-if="!loading && items.length === 0" class="seckill-empty">暂无秒杀活动</div>

    <div class="seckill-list">
      <div class="seckill-card" v-for="item in items" :key="item.itemId">
        <img :src="item.image" :alt="item.name"/>
        <div class="seckill-info">
          <h3 class="seckill-name">{{item.name}}</h3>
          <div class="seckill-price-line">
            <span class="seckill-price"><small>¥</small>{{fmt(item.seckillPrice)}}</span>
            <span class="origin-price">¥{{fmt(item.originalPrice)}}</span>
          </div>
          <div class="stock-text">已抢 {{soldPercent(item)}}% · 剩余 {{item.stock}} 件</div>
          <div class="stock-bar"><i :style="{width: soldPercent(item) + '%'}"></i></div>
          <div class="seckill-foot">
            <span class="seckill-tip">下单后请在 15 分钟内完成支付</span>
            <button class="seckill-btn"
                    :class="{view: successOrderId && successItemId === item.itemId}"
                    :disabled="item.soldOut || busy[item.itemId]"
                    @click="onButton(item)">
              {{btnText(item)}}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="seckill-mask" v-if="successOrderId" @click.self="closeDialog">
    <div class="seckill-dialog">
      <h3>恭喜，抢购成功！</h3>
      <p>订单已创建，请在 15 分钟内完成支付</p>
      <p class="order-no">订单号：{{successOrderId}}</p>
      <div class="dialog-btns">
        <button class="dialog-btn plain" @click="closeDialog">继续逛逛</button>
        <button class="dialog-btn" @click="goOrders">查看订单</button>
      </div>
    </div>
  </div>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/common.js"></script>
<script src="./js/top.js?v=20261206"></script>
<script>
  new Vue({
    el: "#seckillApp",
    data: {
      items: [],
      address: null,
      loading: true,
      busy: {},
      pollTimers: {},
      successOrderId: null,
      successItemId: null,
      countdown: {h: '00', m: '00', s: '00'}
    },
    mounted() {
      // 活动列表无需登录即可浏览，仅在已登录时加载收货地址
      this.loadItems();
      if (sessionStorage.getItem("token")) {
        this.loadAddress();
      }
      this.tick();
      this.clock = setInterval(this.tick, 1000);
    },
    beforeDestroy() {
      clearInterval(this.clock);
      Object.keys(this.pollTimers).forEach(k => clearInterval(this.pollTimers[k]));
    },
    methods: {
      loadItems() {
        axios.get("/orders/seckill/items")
          .then(list => {
            this.items = list || [];
          })
          .catch(err => {
            this.items = [];
            alert((err.response && err.response.data && err.response.data.msg) || "秒杀活动加载失败，请刷新重试");
          })
          .finally(() => this.loading = false);
      },
      loadAddress() {
        axios.get("/addresses")
          .then(list => {
            if (!list || list.length === 0) {
              return;
            }
            this.address = list.find(a => a.isDefault === 1) || list[0];
          })
          .catch(() => {});
      },
      onButton(item) {
        if (this.successOrderId && this.successItemId === item.itemId) {
          this.goOrders();
          return;
        }
        this.buy(item);
      },
      buy(item) {
        if (!sessionStorage.getItem("token")) {
          // 记录回跳地址，登录成功后回到秒杀页继续抢购
          util.store.set("return-url", "/seckill-index.html");
          window.location.href = "/login.html";
          return;
        }
        if (!this.address) {
          alert("请先在订单确认页添加收货地址");
          return;
        }
        if (this.busy[item.itemId]) {
          return;
        }
        this.$set(this.busy, item.itemId, true);
        axios.post("/orders/seckill/" + item.itemId,
          {addressId: this.address.id}, {timeout: 15000})
          .then(() => this.poll(item))
          .catch(err => {
            this.$set(this.busy, item.itemId, false);
            alert((err.response && err.response.data && err.response.data.msg) || "抢购失败，请稍后重试");
            this.loadItems();
          });
      },
      poll(item) {
        let attempts = 0;
        const stop = (ok) => {
          clearInterval(this.pollTimers[item.itemId]);
          delete this.pollTimers[item.itemId];
          this.$set(this.busy, item.itemId, false);
          this.loadItems();
          if (!ok) {
            alert("排队人数较多，请稍后到「我的订单」查看结果");
          }
        };
        this.pollTimers[item.itemId] = setInterval(() => {
          attempts++;
          axios.get("/orders/seckill/result/" + item.itemId)
            .then(res => {
              if (res.status === "SUCCESS") {
                this.successOrderId = res.orderId;
                this.successItemId = item.itemId;
                stop(true);
              } else if (res.status === "FAIL") {
                alert(res.msg || "秒杀失败，库存已释放");
                stop(true);
              } else if (attempts >= 20) {
                stop(false);
              }
            })
            .catch(() => {
              if (attempts >= 20) {
                stop(false);
              }
            });
        }, 1000);
      },
      btnText(item) {
        if (this.successOrderId && this.successItemId === item.itemId) {
          return "查看订单";
        }
        if (this.busy[item.itemId]) {
          return "排队中...";
        }
        if (item.soldOut) {
          return "已抢完";
        }
        return "立即秒杀";
      },
      soldPercent(item) {
        if (!item.totalStock) {
          return 100;
        }
        const sold = item.totalStock - item.stock;
        return Math.min(100, Math.max(0, Math.round(sold * 100 / item.totalStock)));
      },
      tick() {
        const now = new Date();
        let left = 3600 - (now.getMinutes() * 60 + now.getSeconds());
        if (left < 0) {
          left = 0;
        }
        const pad = n => (n < 10 ? "0" + n : "" + n);
        this.countdown = {
          h: pad(Math.floor(left / 3600)),
          m: pad(Math.floor(left % 3600 / 60)),
          s: pad(left % 60)
        };
      },
      closeDialog() {
        this.successOrderId = null;
        this.successItemId = null;
      },
      goOrders() {
        window.location.href = "/orders.html";
      },
      fmt(fen) {
        return (fen / 100).toFixed(2);
      }
    }
  });
</script>
</body>

</html>
