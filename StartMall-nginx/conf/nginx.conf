
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    
    keepalive_timeout  65;

     server {
        # 80 端口被其他程序占用，默认站点改到 18000
        listen       18000;
        server_name  localhost;
        # 指定前端项目所在的位置
        location / {
            root html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
    server {
        listen       18080;
        server_name  localhost;
        # 指定前端项目所在的位置
        location / {
            root html/starmall-portal;
        }
        # HTML 文档禁止浏览器缓存，避免页面修改后读到旧版本
        location ~* \.html$ {
            root html/starmall-portal;
            add_header Cache-Control "no-cache, must-revalidate";
            expires -1;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
        # AI 流式对话（SSE）：关闭缓冲，逐字推送；超时放宽到 5 分钟
        location /api/ai/ {
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
        location /api {
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://127.0.0.1:8080;
        }
    }
    server {
        listen       18081;
        server_name  localhost;
        # 指定前端项目所在的位置
        location / {
            root html/starmall-admin;
        }
        # HTML 文档禁止浏览器缓存，避免页面修改后读到旧版本
        location ~* \.html$ {
            root html/starmall-admin;
            add_header Cache-Control "no-cache, must-revalidate";
            expires -1;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
        location /api {
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://127.0.0.1:8080;
        }
    }
    server {
        listen       18082;
        server_name  localhost;
        # 指定前端项目所在的位置
        location / {
            root html/starmall-refresh-admin;
        }
        # HTML 文档禁止浏览器缓存，避免页面修改后读到旧版本
        location ~* \.html$ {
            root html/starmall-refresh-admin;
            add_header Cache-Control "no-cache, must-revalidate";
            expires -1;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
        location /api {
             proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Real-PORT $remote_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://127.0.0.1:8080;
        }
    }
    # upstream backend {
    #     server 127.0.0.1:8081 max_fails=5 fail_timeout=10s weight=1;
    #     server 127.0.0.1:8082 max_fails=5 fail_timeout=10s weight=1;
    # }  
}
