server:
  port: 8080
spring:
  application:
    name: sm-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${sm.db.host}:3307/small?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${sm.db.pw}
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.small: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 星购商城接口文档
    description: "星购商城接口文档"
    email: zhanghuyi@itcast.cn
    concat: 虎哥
    url: https://www.itcast.cn
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.small.controller
sm:
  jwt:
    location: classpath:small.jks
    alias: small
    password: ${sm.jwt.password}
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
# JWT密钥库口令通过本地profile中的 sm.jwt.password 配置（application-dev.yaml/application-local.yaml 不上传仓库）