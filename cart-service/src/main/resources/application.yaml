server:
  port: 8082
  tomcat:
    threads:
      max: 30
    accept-count: 30
    max-connections: 100
feign:
  okhttp:
    enabled: true # 启用okhttp
  sentinel:
    enabled: true # 启用sentinel监控
hm:
  db:
    database: hm-cart
  swagger:
    title: "星购商城购物车服务接口文档"
    package: com.hmall.cart.controller
spring:
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8090  # 配置sentinel控制台地址
      http-method-specify: true # 允许使用http方法
seata:
  tx-service-group: hmall